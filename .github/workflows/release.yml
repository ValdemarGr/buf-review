name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build CLI
        run: cargo build --release --locked --bin pr

      - name: Smoke test CLI
        run: target/release/pr --version

      - name: Package CLI
        run: tar -czf "pr-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C target/release pr

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "pr-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          --verify-tag --generate-notes
