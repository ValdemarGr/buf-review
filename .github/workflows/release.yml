name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build CLI
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin pr

      - name: Verify static linking
        run: |
          program_headers=$(readelf -lW target/x86_64-unknown-linux-musl/release/pr)
          dynamic_section=$(readelf -dW target/x86_64-unknown-linux-musl/release/pr)
          if grep -q INTERP <<< "$program_headers" || grep -q NEEDED <<< "$dynamic_section"; then
            echo 'Expected a fully static musl binary' >&2
            exit 1
          fi

      - name: Smoke test CLI
        run: target/x86_64-unknown-linux-musl/release/pr --version

      - name: Package CLI
        run: tar -czf "pr-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" -C target/x86_64-unknown-linux-musl/release pr

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "pr-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz"
          --verify-tag --generate-notes
